<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Your Hotel on Google Maps...</title>
    <script>
        window.onload = function() {
            // 사용자의 브라우저 언어 감지
            const userLang = navigator.language || navigator.userLanguage;
            const langCode = userLang.split('-')[0]; // 예: "ko-KR" → "ko"

            // Google Maps 지원 언어 리스트
            const supportedLanguages = [
                "af", "sq", "am", "ar", "hy", "az", "eu", "be", "bn", "bs", "bg", "my",
                "ca", "ceb", "ny", "zh-CN", "zh-TW", "co", "hr", "cs", "da", "nl", "en",
                "eo", "et", "tl", "fi", "fr", "fy", "gl", "ka", "de", "el", "gu", "ht",
                "ha", "haw", "iw", "he", "hi", "hmn", "hu", "is", "ig", "id", "ga", "it",
                "ja", "jw", "kn", "kk", "km", "rw", "ko", "ku", "ky", "lo", "la", "lv",
                "lt", "lb", "mk", "mg", "ms", "ml", "mt", "mi", "mr", "mn", "ne", "no",
                "or", "ps", "fa", "pl", "pt", "pa", "ro", "ru", "sm", "gd", "sr", "st",
                "sn", "sd", "si", "sk", "sl", "so", "es", "su", "sw", "sv", "tg", "ta",
                "tt", "te", "th", "tr", "tk", "uk", "ur", "ug", "uz", "vi", "cy", "xh",
                "yi", "yo", "zu"
            ];

            // 지원되지 않는 언어일 경우 기본값은 영어
            let langParam = "en";
            if (supportedLanguages.includes(langCode)) {
                langParam = langCode;
            }

            // 호텔 위치로 연결 (언어 설정 추가)
            const hotelMapsUrl = `https://maps.app.goo.gl/EMBDasG5NDhUDhLF8?hl=${langParam}`;

            // 자동 리디렉션
            window.location.href = hotelMapsUrl;
        };
    </script>
</head>
<body>
    <p>Redirecting to your hotel on Google Maps...</p>
</body>
</html>
