<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to Google Maps</title>
    <script>
      function redirectToGoogleMaps() {
        // 사용자의 브라우저 언어 감지 (ex: "en-US", "ko-KR", "fa-IR")
        const userLang = navigator.language || navigator.userLanguage;

        // Google Maps에서 지원하는 언어 코드 목록
        const supportedLanguages = [
          "af",
          "sq",
          "am",
          "ar",
          "hy",
          "az",
          "eu",
          "be",
          "bn",
          "bs",
          "bg",
          "my",
          "ca",
          "ceb",
          "ny",
          "zh-CN",
          "zh-TW",
          "co",
          "hr",
          "cs",
          "da",
          "nl",
          "en",
          "eo",
          "et",
          "tl",
          "fi",
          "fr",
          "fy",
          "gl",
          "ka",
          "de",
          "el",
          "gu",
          "ht",
          "ha",
          "haw",
          "iw",
          "he",
          "hi",
          "hmn",
          "hu",
          "is",
          "ig",
          "id",
          "ga",
          "it",
          "ja",
          "jw",
          "kn",
          "kk",
          "km",
          "rw",
          "ko",
          "ku",
          "ky",
          "lo",
          "la",
          "lv",
          "lt",
          "lb",
          "mk",
          "mg",
          "ms",
          "ml",
          "mt",
          "mi",
          "mr",
          "mn",
          "ne",
          "no",
          "or",
          "ps",
          "fa",
          "pl",
          "pt",
          "pa",
          "ro",
          "ru",
          "sm",
          "gd",
          "sr",
          "st",
          "sn",
          "sd",
          "si",
          "sk",
          "sl",
          "so",
          "es",
          "su",
          "sw",
          "sv",
          "tg",
          "ta",
          "tt",
          "te",
          "th",
          "tr",
          "tk",
          "uk",
          "ur",
          "ug",
          "uz",
          "vi",
          "cy",
          "xh",
          "yi",
          "yo",
          "zu",
        ];

        let langParam = "en"; // 기본값: 영어

        // 사용자의 언어 코드가 Google Maps에서 지원하는 경우 적용
        const langCode = userLang.split("-")[0]; // "ko-KR" → "ko" 추출
        if (supportedLanguages.includes(langCode)) {
          langParam = langCode;
        }

        // Google Maps 링크 생성
        const googleMapsUrl = `https://maps.app.goo.gl/?link=https://www.google.com/maps?hl=${langParam}`;

        // Google Maps로 이동
        window.location.href = googleMapsUrl;
      }
    </script>
  </head>
  <body onload="redirectToGoogleMaps()">
    <p>Redirecting to Google Maps...</p>
  </body>
</html>
